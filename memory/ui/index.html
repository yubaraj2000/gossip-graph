<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Memory</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #1d1410; --panel: #2b1d16; --panel-2: #36261d; --line: #4a3427; --text: #f3e6d8; --muted: #b59c86;
    --villager: #e8a65d; --outsider: #9aa3ad; --investigator: #6fa8dc; --news: #f0b429; --friend: #6b5444;
    --bad: #e06c5a; --good: #7cc47f; --flash: #fff3a0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 2px solid var(--line); background: var(--panel); }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  h1 small { color: var(--muted); font-weight: 400; }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 4px 8px; font: inherit; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
          color: var(--muted); }
  .chip b { color: var(--text); }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good);
          margin-right: 6px; }
  .live.off { background: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 12px 16px;
         height: calc(100vh - 56px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex;
            flex-direction: column; min-height: 0; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
               margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px;
               align-items: center; }
  section h2 label { text-transform: none; letter-spacing: 0; font-size: 12px; display: flex; gap: 4px;
                     align-items: center; cursor: pointer; }
  #graph { flex: 1; min-height: 0; }
  .legend { display: flex; gap: 14px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted);
            font-size: 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .legend .bar { width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; }
  #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #feed li { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #feed li.new { animation: arrive 2.5s ease-out; }
  @keyframes arrive { from { background: #5a4520; } to { background: transparent; } }
  #feed .meta { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  #feed .claim { margin-top: 2px; }
  #feed .claim.bad { border-left: 3px solid var(--bad); padding-left: 6px; }
  #feed .claim.good { border-left: 3px solid var(--good); padding-left: 6px; }
  #feed .heard { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 3px; }
  #feed .outdated { text-decoration: line-through; opacity: .6; }
  .empty { color: var(--muted); padding: 16px 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #graph { height: 60vh; }
                              #feed { max-height: 50vh; } }
</style>
</head>
<body>
<header>
  <h1>🧠 Village memory <small>· the FalkorDB graph behind the town</small></h1>
  <select id="world" aria-label="Village"></select>
  <div class="chips" id="totals"></div>
</header>
<main>
  <section>
    <h2>Who learns from whom
      <label><input type="checkbox" id="show-news" checked> news flow</label>
      <label><input type="checkbox" id="show-friends" checked> friendships</label>
    </h2>
    <div id="graph"></div>
    <div class="legend">
      <span><i style="background:var(--villager)"></i>villager</span>
      <span><i style="background:var(--outsider)"></i>outsider</span>
      <span><i style="background:var(--investigator)"></i>investigator</span>
      <span><i class="bar" style="background:var(--news)"></i>news flowed: each villager's top 2 sources (thicker = more)</span>
      <span><i class="bar" style="background:var(--friend)"></i>friends (they shape the layout)</span>
      <span>circle size = how much they believe</span>
    </div>
  </section>
  <section>
    <h2><span class="live" id="live"></span>Beliefs forming, live</h2>
    <ul id="feed"><li class="empty">Waiting for gossip…</li></ul>
  </section>
</main>
<script>
const POLL_MS = 3000;
const TOP_SOURCES = 2;
const COLORS = { villager: '#e8a65d', outsider: '#9aa3ad', investigator: '#6fa8dc' };
const params = new URLSearchParams(location.search);
let world = params.get('world');
let since = null, timer = null, network = null;
const nodes = new vis.DataSet(), edges = new vis.DataSet();
const seenFeed = new Set();

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pct(x) { return Math.round(x * 100) + '%'; }
function clock(ms) { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}

async function loadWorlds() {
  const { worlds } = await api('/worlds');
  const visible = worlds.filter(w => !w.startsWith('test_'));
  if (!world || !visible.includes(world)) {
    let saved = null;
    try { saved = localStorage.getItem('memory-ui-world'); } catch (e) {}
    world = visible.includes(saved) ? saved : visible[0];
  }
  const sel = document.getElementById('world');
  sel.replaceChildren(...visible.map(w => {
    // AI Town (Convex) world ids are 32 lowercase letters/digits; other worlds are named, e.g. chandanpur_b.
    const o = el('option', null, /^[a-z0-9]{32}$/.test(w) ? `AI Town world ${w.slice(0, 8)}…` : w);
    o.value = w; o.selected = w === world; return o;
  }));
  sel.onchange = () => switchWorld(sel.value);
}

function switchWorld(w) {
  world = w; since = null; seenFeed.clear(); nodes.clear(); edges.clear();
  try { localStorage.setItem('memory-ui-world', w); } catch (e) {}
  document.getElementById('feed').replaceChildren(el('li', 'empty', 'Waiting for gossip…'));
  network.setOptions({ physics: { enabled: true } });
  poll();
}

function nodeFor(c) {
  const color = COLORS[c.role];
  return {
    id: c.id, label: c.name, shape: 'dot', size: 10 + Math.sqrt(c.beliefs) * 1.3,
    color: { background: color, border: color, highlight: { background: color, border: '#fff' } },
    font: { color: css('--text'), size: 15, strokeWidth: 3, strokeColor: css('--bg') },
    title: `${c.name} · ${c.role}\n${c.beliefs} active beliefs · talked about in ${c.talked_about} claims` +
           (c.gullibility != null ? `\ngullibility ${c.gullibility}` : ''),
  };
}

function render(data) {
  const showNews = document.getElementById('show-news').checked;
  const showFriends = document.getElementById('show-friends').checked;
  nodes.update(data.characters.map(nodeFor));
  const keep = new Set(data.characters.map(c => c.id));
  nodes.remove(nodes.getIds().filter(id => !keep.has(id)));

  const want = [];
  if (showFriends) {
    const pairs = new Set();
    for (const [a, b] of data.friendships) {
      const key = a < b ? `${a}|${b}` : `${b}|${a}`;
      if (pairs.has(key)) continue;
      pairs.add(key);
      want.push({ id: 'friend:' + key, from: a, to: b, dashes: [4, 6], width: 1.5, smooth: false,
                  color: { color: css('--friend') }, arrows: '', physics: true });
    }
  }
  if (showNews) {
    // After hours of talk everyone has heard something from everyone; draw each listener's top sources only.
    const byListener = {};
    for (const f of data.news_flow) (byListener[f.to] ??= []).push(f);
    const top = Object.values(byListener).flatMap(fs => fs.sort((x, y) => y.count - x.count).slice(0, TOP_SOURCES));
    for (const f of top) {
      want.push({ id: `news:${f.from}>${f.to}`, from: f.from, to: f.to, width: 1 + Math.log2(1 + f.count) * 1.6,
                  color: { color: css('--news'), opacity: 0.75 }, arrows: { to: { scaleFactor: 0.5 } },
                  smooth: { type: 'curvedCW', roundness: 0.15 }, physics: false,
                  title: `${f.count}× news flowed` });
    }
  }
  const wantIds = new Set(want.map(e => e.id));
  edges.remove(edges.getIds().filter(id => !wantIds.has(id) && !String(id).startsWith('flash:')));
  edges.update(want);

  const t = data.totals;
  document.getElementById('totals').replaceChildren(
    ...[['beliefs', 'active beliefs'], ['outdated', 'outdated'], ['claims', 'claims'], ['conversations', 'conversations']]
      .map(([k, label]) => { const c = el('span', 'chip'); c.append(el('b', null, t[k]), ` ${label}`); return c; }));
}

function feedItem(b, fresh) {
  const li = el('li', fresh ? 'new' : null);
  const who = b.origin === 'witnessed' ? `👁 ${b.holder_name} saw it`
            : b.origin === 'heard' ? `👂 ${b.holder_name} heard it from ${b.from_name ?? 'someone'}`
            : `🗣 ${b.holder_name} started saying`;
  const meta = el('div', 'meta');
  meta.append(el('span', null, who), el('span', null, `${pct(b.confidence)} · ${clock(b.at)}`));
  const claim = el('div', 'claim ' + (b.valence < 0 ? 'bad' : b.valence > 0 ? 'good' : ''), b.text);
  if (b.status === 'superseded') { claim.classList.add('outdated'); claim.title = 'later shown to be false or garbled'; }
  li.append(meta, claim);
  if (b.line) li.append(el('div', 'heard', `“${b.line.replace(/^"|"$/g, '').slice(0, 180)}”`));
  return li;
}

function flash(b) {
  const id = b.from ? `flash:${b.from}>${b.holder}:${b.at}` : null;
  if (id && nodes.get(b.from) && nodes.get(b.holder)) {
    edges.add({ id, from: b.from, to: b.holder, width: 6, color: { color: css('--flash') }, physics: false,
                arrows: { to: { scaleFactor: 0.8 } }, smooth: { type: 'curvedCW', roundness: 0.15 } });
    setTimeout(() => edges.remove(id), 2500);
  }
  const n = nodes.get(b.holder);
  if (n) {
    nodes.update({ id: n.id, borderWidth: 5, color: { ...n.color, border: css('--flash') } });
    setTimeout(() => { const c = nodes.get(n.id); if (c) nodes.update({ id: n.id, borderWidth: 1, color: { ...c.color, border: c.color.background } }); }, 2500);
  }
}

function addFeed(items, firstLoad) {
  const feed = document.getElementById('feed');
  const fresh = items.filter(b => !seenFeed.has(`${b.holder}|${b.claim}|${b.from}`)).reverse(); // oldest first
  if (!fresh.length) return;
  feed.querySelector('.empty')?.remove();
  for (const b of fresh) {
    seenFeed.add(`${b.holder}|${b.claim}|${b.from}`);
    feed.prepend(feedItem(b, !firstLoad));
    if (!firstLoad) flash(b);
  }
  while (feed.children.length > 120) feed.lastChild.remove();
}

async function poll() {
  clearTimeout(timer);
  const live = document.getElementById('live');
  try {
    const first = since === null;
    const data = await api(`/worlds/${encodeURIComponent(world)}/graph` + (first ? '' : `?since=${since}`));
    render(data);
    addFeed(data.feed, first);
    since = data.feed.length ? Math.max(since ?? 0, ...data.feed.map(b => b.at)) : (since ?? data.now);
    live.classList.remove('off'); live.title = 'live';
  } catch (e) {
    live.classList.add('off'); live.title = String(e);
  }
  timer = setTimeout(poll, POLL_MS);
}

function start() {
  network = new vis.Network(document.getElementById('graph'), { nodes, edges }, {
    // Only friendships pull nodes together, so the layout shows the village's circles and the bridge between them.
    physics: { solver: 'forceAtlas2Based',
               forceAtlas2Based: { gravitationalConstant: -90, springLength: 120, springConstant: 0.06, avoidOverlap: 0.6 },
               stabilization: { iterations: 400 } },
    layout: { randomSeed: 7 },  // the same map every time the page opens
    interaction: { hover: true, tooltipDelay: 150 },
    edges: { selectionWidth: 2 },
  });
  // Lay the village out once, then hold still so new gossip doesn't make the map jump.
  network.on('stabilizationIterationsDone', () => { network.setOptions({ physics: { enabled: false } }); network.fit(); });
  for (const id of ['show-news', 'show-friends']) document.getElementById(id).onchange = () => { since = null; seenFeed.clear(); poll(); };
  loadWorlds().then(poll).catch(e => { document.getElementById('live').classList.add('off'); console.error(e); });
}
start();
</script>
</body>
</html>
