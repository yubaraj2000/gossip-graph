services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      # Bound to localhost only, so the unauthenticated DB isn't exposed to the LAN
      - "127.0.0.1:6379:6379" # FalkorDB server
      - "127.0.0.1:3000:3000" # FalkorDB Browser UI
    environment:
      # AOF on top of the image's RDB snapshots, so every write survives a restart
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
      # Replaces the image default (MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000):
      # 10s default / 60s max for reads and writes, and a deeper queue for concurrent agents
      - FALKORDB_ARGS=TIMEOUT_DEFAULT 10000 TIMEOUT_MAX 60000 RESULTSET_SIZE 10000 MAX_QUEUED_QUERIES 500
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
